global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout tunnel 1h

frontend secure_ingress
    # Certificate PEM must contain server certificate, intermediates and private key.
    bind :443 ssl crt /etc/haproxy/certs/telemetry.pem alpn http/1.1
    mode http
    # Do NOT trust user-supplied forwarding headers.
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port 443
    default_backend ui_proxy

backend ui_proxy
    mode http
    option http-server-close
    timeout tunnel 1h
    # Nginx frontend proxies /api, /admin, /static, /healthz and /ws to Django.
    server frontend frontend:80 check inter 5s fall 3 rise 2
