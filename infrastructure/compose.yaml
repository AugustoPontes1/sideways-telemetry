# Run from the repository root: docker compose --env-file infrastructure/.env -f infrastructure/compose.yaml up -d --build
# Do not expose PostgreSQL, Redis, Django, or Nginx directly on the host.
name: drift-telemetry-lab

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drift_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [data]

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY obrigatório}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS obrigatório}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS obrigatório}
      DJANGO_TRUST_PROXY_PROTO: "1"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:?TELEMETRY_TOKEN obrigatório}
      TELEMETRY_AGENT_ID: ${TELEMETRY_AGENT_ID:-wsl-assetto-agent}
      DATABASE_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-drift_telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    entrypoint:
      - /bin/sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    expose: ["8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=3).read()"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks: [edge, data]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose: ["80"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

  haproxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/haproxy/certs:ro
    ports:
# Secure by default (localhost); set HTTPS_BIND_IP to the LAN IP in .env when needed.
      - "${HTTPS_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    depends_on:
      frontend: {condition: service_started}
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
