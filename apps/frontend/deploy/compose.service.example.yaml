# Add this snippet to the `services:` section of backend/compose.yaml.
# This is NOT a standalone Compose file. Run it from the backend/ directory.
frontend:
  build:
    context: ../frontend
  restart: unless-stopped
  ports:
    - "127.0.0.1:8080:80"
  depends_on:
    backend:
      condition: service_healthy
  networks: [internal]
